services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://settleai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/settleai
      - API_KEY_PEPPER=${API_KEY_PEPPER:?Set API_KEY_PEPPER}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: settleai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: settleai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settleai -d settleai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
