# Render blueprint (spec §17). Deploy: Render dashboard > New > Blueprint > this repo.
# Secrets marked sync:false are entered in the dashboard and never committed.
# Free plan: the embedded database (PGlite) runs inside the service, and migrations and demo data run on every start,
# built into a pristine template at deploy time and restored on every boot, so a restart always gives a clean demo
# and a 0.1 CPU instance does not have to reseed two weeks of history while a visitor waits. The free service sleeps when idle; the first visit wakes it.
services:
  - type: web
    name: settleai
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build && pnpm db:template && pnpm build:standalone
    # Plain node: no pnpm, corepack or tsx at runtime. Flags are here, not in NODE_OPTIONS, so they do not limit the build.
    # --liftoff-only: V8's optimizing compiler pushes PGlite's WASM startup from about 230 MB to about 600 MB.
    startCommand: cd .next/standalone && node --max-old-space-size=320 --liftoff-only db-boot.cjs boot && exec node --max-old-space-size=320 --liftoff-only server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY_PEPPER
        generateValue: true
      - key: PROCUREBOT_API_KEY # optional; unset keeps the agent API closed. Use the same value as SETTLEAI_API_KEY in an MCP client
        sync: false
      - key: SANDBOX_WORKER_EMAIL # the PayPal sandbox account that receives payouts
        sync: false
      - key: PLATFORM_SIGNING_KEY_JWK
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: CHALLENGE_WINDOW_SECONDS
        value: "15"
      - key: DISPUTE_EVIDENCE_WINDOW_SECONDS
        value: "45"

