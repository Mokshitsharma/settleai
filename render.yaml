# Render blueprint (spec §17). Deploy: Render dashboard > New > Blueprint > this repo.
# Secrets marked sync:false are entered in the dashboard and never committed.
# Free plan: the embedded database (PGlite) runs inside the service, and migrations and demo data run on every start,
# wiped and reseeded on every boot, so a restart always gives a clean demo. The free service sleeps when idle; the first visit wakes it.
services:
  - type: web
    name: settleai
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm db:reset && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY_PEPPER
        generateValue: true
      - key: PROCUREBOT_API_KEY # optional; unset keeps the agent API closed. Use the same value as SETTLEAI_API_KEY in an MCP client
        sync: false
      - key: SANDBOX_WORKER_EMAIL # the PayPal sandbox account that receives payouts
        sync: false
      - key: PLATFORM_SIGNING_KEY_JWK
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: CHALLENGE_WINDOW_SECONDS
        value: "15"
      - key: DISPUTE_EVIDENCE_WINDOW_SECONDS
        value: "45"

