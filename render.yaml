# Render blueprint (spec §17). Deploy: Render dashboard > New > Blueprint > this repo.
# Secrets marked sync:false are entered in the dashboard and never committed.
services:
  - type: web
    name: settleai
    runtime: node
    plan: starter # always-on, so the demo never cold-starts during judging (1-15 Dec 2026)
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: settleai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY_PEPPER
        generateValue: true
      - key: PROCUREBOT_API_KEY # set in the dashboard; use the same value as SETTLEAI_API_KEY in the MCP client
        sync: false
      - key: PLATFORM_SIGNING_KEY_JWK
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: CHALLENGE_WINDOW_SECONDS
        value: "15"
      - key: DISPUTE_EVIDENCE_WINDOW_SECONDS
        value: "45"

databases:
  - name: settleai-db
    plan: basic-256mb
